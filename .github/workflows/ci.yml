name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Committed model loads and serves
        run: |
          PYTHONPATH=src python - <<'PY'
          from fastapi.testclient import TestClient
          from tripeta.api import app
          c = TestClient(app)
          assert c.get("/ready").status_code == 200
          r = c.post("/predict", json={"pickup_zone": 161, "dropoff_zone": 237, "pickup_time": "2023-10-14T18:30:00", "distance_miles": 2.4})
          print(r.json()); assert r.status_code == 200
          PY
      - name: Load test the real server
        run: PYTHONPATH=src python scripts/loadtest.py --requests 1600 --concurrency 8
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t taxi-eta-service .
      - name: Run the container and call it
        run: |
          docker run -d --name eta -p 8000:8000 taxi-eta-service
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"pickup_zone":161,"dropoff_zone":237,"pickup_time":"2023-10-14T18:30:00","distance_miles":2.4}'
